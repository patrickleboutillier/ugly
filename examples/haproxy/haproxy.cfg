# The UGLY HAProxy proof of concept: run by run_poc.py, which fills in
# @PORT@, @LUA@ and @NBTHREAD@. No chroot: Python finds its standard library
# when it starts, on the first request.
global
    nbthread @NBTHREAD@
    @LUA@

defaults
    mode http
    timeout connect 5s
    timeout client 5s
    timeout server 5s

frontend web
    bind 127.0.0.1:@PORT@
    http-request lua.decide
    http-request set-header X-Reason %[var(txn.reason)]
    # Fail closed: only Python's explicit "allow" lets a request through.
    http-request return status 200 content-type text/plain lf-string "allowed: %[var(txn.reason)]\n" if { var(txn.verdict) -m str allow }
    http-request return status 403 content-type text/plain lf-string "denied: %[var(txn.reason)]\n"
